<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Structured DNS errors in Chromium</title>
  <desc id="desc">Conceptual illustration of resolver error metadata being parsed and validated in Chromium, then expanded into a details URL. This is not a shipped browser screen.</desc>
  <rect width="1200" height="750" fill="#EBEEF5"/>
  <g font-family="sans-serif">
    <text x="75" y="112" fill="#252629" font-size="51" font-weight="500">A failed query. A useful reason.</text>
    <text x="78" y="158" fill="#686C75" font-size="22">Inside Chromium’s DNS stack</text>
    <rect x="205" y="241" width="710" height="346" rx="18" fill="#FFFFFF"/>
    <path d="M205 300H915" stroke="#DFE1E6"/>
    <circle cx="235" cy="270" r="5" fill="#C9CDD6"/><circle cx="255" cy="270" r="5" fill="#C9CDD6"/><circle cx="275" cy="270" r="5" fill="#C9CDD6"/>
    <text x="556" y="277" text-anchor="middle" fill="#686C75" font-size="16">Public Resolver Errors</text>
    <text x="245" y="349" fill="#686C75" font-size="17">Extended DNS error metadata</text>
    <g font-family="monospace" font-size="28"><text x="245" y="401" fill="#252629">{</text><text x="274" y="447" fill="#365CF5">"ro": <tspan fill="#252629">resolver operator</tspan></text><text x="274" y="493" fill="#365CF5">"inc": <tspan fill="#252629">filtering incident</tspan></text><text x="245" y="539" fill="#252629">}</text></g>
    <circle cx="924" cy="471" r="98" fill="#365CF5"/>
    <g fill="none" stroke="white" stroke-width="3"><circle cx="924" cy="471" r="39"/><ellipse cx="924" cy="471" rx="17" ry="39"/><path d="M885 471H963M892 448H956M892 494H956"/></g>
    <text x="76" y="665" fill="#252629" font-size="22">Parse + validate</text><path d="M254 657H340M330 647l10 10-10 10" stroke="#686C75" stroke-width="2" fill="none"/>
    <text x="369" y="665" fill="#252629" font-size="22">Expand URI template</text><path d="M622 657H708M698 647l10 10-10 10" stroke="#686C75" stroke-width="2" fill="none"/>
    <text x="735" y="665" fill="#252629" font-size="22">Resolver details URL</text>
  </g>
</svg>
